pre-commit:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    lint:
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      run: npm run lint:staged
    format:
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      run: npm run fmt:staged
    format-yaml:
      glob: "*.{yml,yaml}"
      run: prettier --check {staged_files}

commit-msg:
  commands:
    lint-commit-msg:
      run: npx --no-install commitlint --edit "$1"

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    lint:
      run: npm run lint
    format:
      run: npm run fmt
    format-yaml:
      run: npm run fmt-yaml
    tests:
      run: npm run test:cov
    are-the-types-wrong:
      run: npm run attw
